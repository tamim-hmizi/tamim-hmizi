  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>
  <text x="64" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#eab308">SOFTWARE ENGINEER · CLOUD, DEVOPS &amp; AI</text>
  <text x="64" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff">Tamim Hmizi</text>
  <text x="64" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#d1d5db">I build software <tspan fill="#eab308" font-weight="700">and the cloud it runs on.</tspan></text>
  <text x="64" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9ca3af">Full Stack Engineer at Bassetti Group · Founder of Axynoxia · Tunis</text>
  <g transform="translate(930 70)" fill="none" stroke="#eab308" stroke-width="3" stroke-linejoin="round" opacity="0.9">
    <path d="M60 0 120 34v68L60 136 0 102V34Z"/>
