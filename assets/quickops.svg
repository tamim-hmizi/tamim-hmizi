<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc"><title id="title">QuickOps. Repository to runtime.</title><desc id="desc">Analyze with Python and FastAPI, provision with Terraform and Ansible, deploy and monitor with Jenkins, AKS, Prometheus and Grafana.</desc><rect width="1600" height="620" fill="#0b0c0e"/><text x="60" y="112" font-family="Arial,sans-serif" font-weight="700" font-size="74" fill="#eef0f3">QuickOps</text><text x="60" y="174" font-family="Arial,sans-serif" font-size="30" fill="#eef0f3">My RFC final year project. Repository to runtime.</text><g fill="#1f2de6"><rect x="60" y="237" width="440" height="200"/><rect x="580" y="237" width="440" height="200"/><rect x="1100" y="237" width="440" height="200"/></g><g font-family="Arial,sans-serif" fill="white"><g font-size="54" font-weight="700"><text x="90" y="316">Analyze</text><text x="610" y="316">Provision</text><text x="1130" y="316">Deploy</text></g><g font-size="27"><text x="90" y="388">Python · FastAPI · LLMs</text><text x="610" y="388">Terraform · Ansible</text><text x="1130" y="388">Jenkins · VM / AKS</text></g><g font-size="52"><text x="513" y="350">→</text><text x="1033" y="350">→</text></g><text x="60" y="528" font-size="30">React + Express + MongoDB</text><text x="1540" y="528" text-anchor="end" font-size="30">Prometheus + Grafana</text></g></svg>
